<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Click Bait</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M9 21V11l7-4 7 4v10' stroke='%23fff' stroke-width='2' fill='none' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23fff'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="app-header__title">
        <h1>The Click Bait</h1>
        <p class="app-header__subtitle">Tracking every apprenticeship application, from saved leads to offers.</p>
      </div>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
        <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
        <span class="theme-toggle__label">Dark mode</span>
      </button>
    </header>

    <section class="stats" id="stats" aria-label="Summary statistics"></section>

    <section class="controls">
      <div class="controls__group">
        <label class="visually-hidden" for="search">Search applications</label>
        <input id="search" type="search" placeholder="Search company or role…" autocomplete="off" />
      </div>
      <div class="controls__group">
        <label for="status-filter">Status</label>
        <select id="status-filter">
          <option value="all">All</option>
          <option value="saved">Saved</option>
          <option value="applied">Applied</option>
          <option value="interview">Interview</option>
          <option value="offer">Offer</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>
      <div class="controls__group view-toggle" role="tablist" aria-label="Dashboard view">
        <button class="view-toggle__btn is-active" data-view="board" role="tab" aria-selected="true" type="button">Board</button>
        <button class="view-toggle__btn" data-view="table" role="tab" aria-selected="false" type="button">Table</button>
      </div>
    </section>

    <main>
      <section id="board-view" class="board" aria-label="Applications by status"></section>

      <section id="table-view" class="table-wrap is-hidden" aria-label="Applications table">
        <table id="applications-table">
          <thead>
            <tr>
              <th data-sort="company">Company</th>
              <th data-sort="role">Role</th>
              <th data-sort="status">Status</th>
              <th data-sort="dateApplied">Date applied</th>
              <th data-sort="deadline">Deadline</th>
              <th data-sort="nextStepDate">Next step</th>
              <th>Link</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
        <p id="table-empty" class="empty-state is-hidden">No applications match your filters.</p>
      </section>
    </main>

    <footer class="app-footer">
      <p>Data lives in <code>data/applications.json</code> — edit it in VS Code, commit, and push to update this site.</p>
    </footer>
  </div>

  <template id="card-template">
    <article class="card">
      <header class="card__header">
        <h3 class="card__company"></h3>
        <span class="card__role"></span>
      </header>
      <dl class="card__meta"></dl>
      <p class="card__notes"></p>
      <a class="card__link" target="_blank" rel="noopener">View posting →</a>
    </article>
  </template>

  <script src="assets/app.js"></script>
</body>
</html>
